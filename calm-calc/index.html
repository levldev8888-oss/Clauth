<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CALM Calc</title><style>
:root{--opacity:.58;--blur:18px;--ink:#293445;--glass:rgba(255,255,255,var(--opacity))}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#c8d5d7;display:grid;place-items:center;overflow-x:hidden}#wallpaper{position:fixed;inset:0;background:linear-gradient(145deg,#e4d8ec,#b8d5d3 55%,#e9d8c7);background-size:cover;background-position:center;z-index:-2}#wallpaper:after{content:"";position:absolute;inset:0;background:rgba(242,244,250,.13)}.app{width:min(94vw,410px);padding:22px;border:1px solid rgba(255,255,255,.7);border-radius:32px;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 20px 70px #3542572b}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.12em;font-size:15px}.sub{font-size:10px;opacity:.6;letter-spacing:.16em}.icon{border:1px solid #ffffff9c;background:#ffffff7d;border-radius:14px;padding:10px 13px;font-size:19px;color:inherit;cursor:pointer}.screen{min-height:155px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px 3px;overflow:hidden}.expression{font-size:19px;opacity:.65;min-height:27px;overflow-wrap:anywhere}.result{font-size:clamp(33px,9vw,48px);font-weight:650;overflow-wrap:anywhere;line-height:1.15}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.key{border:1px solid #ffffffad;background:#ffffff72;box-shadow:0 4px 12px #35425712;border-radius:19px;min-height:66px;color:#344253;font-size:23px;font-weight:550;cursor:pointer;touch-action:manipulation;transition:background .15s}.key:active{background:#fff9}.key.special{background:#c4d9d8b8}.key.operator{background:#d4cceac7}.key.equal{background:#a9c6c0;color:#203a3a;grid-column:span 2}.pop{animation:pop .25s cubic-bezier(.2,1.6,.5,1)}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.88)}80%{transform:scale(1.08)}100%{transform:scale(1)}}.settings{display:none;margin-top:18px;padding:15px;border-radius:20px;background:#ffffff6b;border:1px solid #fff9}.settings.show{display:block}.settings label{display:flex;justify-content:space-between;font-size:13px;margin:13px 0 5px}.settings input[type=range]{width:100%;accent-color:#799e9a}.file{display:block;text-align:center;background:#d1e0de;border-radius:13px;padding:12px;font-size:13px;font-weight:650;cursor:pointer}.settings input[type=file]{display:none}.hint{font-size:11px;opacity:.65;text-align:center;margin-top:14px}.row{display:flex;gap:8px;margin-top:12px}.small{flex:1;padding:9px;border:0;border-radius:12px;background:#ffffffa3;color:inherit}button:focus-visible,.file:focus-visible{outline:2px solid #688d91;outline-offset:2px}@media(max-height:730px){.app{padding:17px}.screen{min-height:115px}.key{min-height:55px}}@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style></head><body><div id="wallpaper"></div><main class="app"><div class="top"><div><div class="brand">CALM CALC</div><div class="sub">SOFT • SIMPLE • YOURS</div></div><button class="icon" id="settingsBtn" aria-label="Pengaturan" aria-expanded="false">⚙</button></div><div class="screen" aria-live="polite"><div class="expression" id="expression"></div><div class="result" id="result">0</div></div><div class="keys" id="keys"><button class="key special" data-key="AC">AC</button><button class="key special" data-key="DEL">⌫</button><button class="key special" data-key="%">%</button><button class="key operator" data-key="/">÷</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key operator" data-key="*">×</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key operator" data-key="-">−</button><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key operator" data-key="+">+</button><button class="key" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equal" data-key="=">=</button></div><section class="settings" id="settings"><label class="file" for="photo">🖼 Pilih wallpaper dari galeri</label><input type="file" id="photo" accept="image/*"><label for="opacity">Transparansi kaca <span id="opacityValue">42%</span></label><input type="range" id="opacity" min="10" max="95" value="42"><label for="blur">Blur kaca <span id="blurValue">18px</span></label><input type="range" id="blur" min="0" max="35" value="18"><div class="row"><button class="small" id="reset">Reset tampilan</button></div></section><div class="hint">Made for peaceful calculations ✦</div></main><script>
'use strict';const $=id=>document.getElementById(id);let current='0',previous=null,operator=null,waiting=false,history='';const symbols={'+':'+','-':'−','*':'×','/':'÷'};function fmt(n){if(!Number.isFinite(n))return 'Error';return String(Number(n.toPrecision(12)))}function display(){const expr=previous!==null?`${previous} ${symbols[operator]} ${waiting?'':current}`:history;$('expression').textContent=expr;$('result').textContent=current}function calculate(a,b,op){switch(op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return b===0?NaN:a/b;default:return b}}function input(key){if(key==='AC'){current='0';previous=null;operator=null;waiting=false;history=''}else if(key==='DEL'){if(waiting){waiting=false;current='0'}else current=current.length>1?current.slice(0,-1):'0'}else if(/^\d$/.test(key)){if(waiting){current=key;waiting=false}else if(current.replace(/[.\-]/g,'').length<14)current=current==='0'?key:current+key}else if(key==='.'){if(waiting){current='0.';waiting=false}else if(!current.includes('.'))current+='.'}else if(key==='%'){current=fmt(Number(current)/100)}else if(['+','-','*','/'].includes(key)){if(previous!==null&&!waiting){const v=calculate(Number(previous),Number(current),operator);if(!Number.isFinite(v)){current='Error';previous=null;operator=null;history='';display();return}previous=fmt(v)}else previous=current;operator=key;waiting=true;history=''}else if(key==='='&&previous!==null&&operator){const b=Number(current),a=Number(previous);history=`${previous} ${symbols[operator]} ${current} =`;current=fmt(calculate(a,b,operator));previous=null;operator=null;waiting=true}if(current==='Error'&&key!=='='){previous=null;operator=null;waiting=true}display()}
$('keys').addEventListener('click',e=>{const btn=e.target.closest('[data-key]');if(!btn)return;btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');input(btn.dataset.key)});document.addEventListener('keydown',e=>{const k=e.key;if(e.target.matches('input'))return;let mapped=k==='Enter'?'=':k==='Backspace'?'DEL':k==='Escape'?'AC':k;if(/^[0-9.+*/%=-]$/.test(mapped)||['DEL','AC'].includes(mapped)){e.preventDefault();input(mapped)}});$('settingsBtn').onclick=()=>{const open=$('settings').classList.toggle('show');$('settingsBtn').setAttribute('aria-expanded',String(open))};function apply(){const opacity=Number($('opacity').value),blur=Number($('blur').value);document.documentElement.style.setProperty('--opacity',String(1-opacity/100));document.documentElement.style.setProperty('--blur',blur+'px');$('opacityValue').textContent=opacity+'%';$('blurValue').textContent=blur+'px';localStorage.setItem('calmPrefs',JSON.stringify({opacity,blur}))}for(const id of ['opacity','blur'])$(id).addEventListener('input',apply);try{const p=JSON.parse(localStorage.getItem('calmPrefs'));if(p){$('opacity').value=p.opacity;$('blur').value=p.blur}}catch{}apply();
const DB='calmCalcDB';function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function storeImage(blob){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,'wallpaper');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function getImage(){const db=await dbOpen();return new Promise((resolve,reject)=>{const req=db.transaction('images').objectStore('images').get('wallpaper');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function removeImage(){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete('wallpaper');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}let objectURL=null;function showImage(blob){if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);$('wallpaper').style.backgroundImage=`url("${objectURL}")`}$('photo').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Pilih file gambar.');try{await storeImage(file);showImage(file)}catch{alert('Gagal menyimpan wallpaper. Coba gambar lebih kecil.')}});$('reset').onclick=async()=>{$('opacity').value=42;$('blur').value=18;apply();$('wallpaper').style.backgroundImage='';if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}try{await removeImage()}catch{}};getImage().then(blob=>{if(blob)showImage(blob)}).catch(()=>{});display();
</script></body></html>
